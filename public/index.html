<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Brian</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.45' stop-color='%23a9c7ff'/%3E%3Cstop offset='1' stop-color='%23314a8c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="bg" id="bgA"></div>
<div class="bg" id="bgB"></div>
<div class="veil"></div>

<div id="login" class="login" hidden>
  <form class="glass login-card" id="loginForm">
    <div class="orb big"></div>
    <h1 class="serif">Brian</h1>
    <p class="muted" id="loginHint">Good day, sir. The password, if you please.</p>
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Enter</button>
    <p class="error" id="loginError"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="glass nav">
    <div class="brand"><span class="orb"></span><span class="serif">Brian</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="nav-actions">
      <button class="btn primary" data-action="call" title="Have Brian ring your mobile">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
        <span>Call me</span>
      </button>
    </div>
  </header>
  <main id="view"></main>
</div>

<button class="glass chat-fab" id="chatFab" data-action="toggle-chat" hidden aria-label="Talk to Brian"><span class="orb"></span></button>
<section class="glass chat" id="chat" hidden>
  <div class="chat-head"><span class="orb"></span><strong>Brian</strong><span class="muted small">at your service</span>
    <button class="icon-btn" data-action="toggle-chat" aria-label="Close">×</button></div>
  <div class="chat-log" id="chatLog"></div>
  <form class="chat-form" id="chatForm">
    <input id="chatInput" placeholder="Ask Brian anything…" autocomplete="off">
    <button class="btn primary" type="submit">Send</button>
  </form>
</section>

<div class="modal-wrap" id="modal" hidden><form class="glass modal" id="modalForm"></form></div>
<div class="toast glass" id="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
